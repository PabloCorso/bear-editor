[package]
name = "bear-rectools"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
elma-formats = { git = "https://github.com/elmadev/rectools", rev = "2fd03a85d0fee2b42cdf79d9526ae82ed248dfe6" }
render = { git = "https://github.com/elmadev/rectools", rev = "2fd03a85d0fee2b42cdf79d9526ae82ed248dfe6" }
replay = { git = "https://github.com/elmadev/rectools", rev = "2fd03a85d0fee2b42cdf79d9526ae82ed248dfe6" }
wgpu = { version = "=30.0.1", default-features = false, features = ["webgl", "wgsl"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
