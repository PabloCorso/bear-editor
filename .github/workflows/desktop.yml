name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "desktop/**"
      - "experiments/rectools/**"
      - ".github/workflows/desktop.yml"
      - "vite.config.ts"
      - "react-router.config.ts"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build rectools WASM
        shell: bash
        run: |
          rustup toolchain install 1.100.0 --profile minimal --target wasm32-unknown-unknown
          cargo +1.100.0 install wasm-bindgen-cli --version 0.2.129 --locked
          RUSTUP_TOOLCHAIN=1.100.0 sh experiments/rectools/build.sh
      - run: npm run desktop:build
        # Same public website ID as the production web deployment in netlify.toml.
        env:
          VITE_UMAMI_WEBSITE_ID: 282c028b-3c2c-4e3f-a0a5-e3192e644dba
      - run: npm install --prefix desktop
      - run: npm --prefix desktop run package
      - uses: actions/upload-artifact@v4
        with:
          name: bear-editor-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.blockmap
            !desktop/dist/*.dmg.blockmap
            desktop/dist/latest.yml
            desktop/dist/latest-linux.yml

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bear-editor-*
          path: release-assets
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
