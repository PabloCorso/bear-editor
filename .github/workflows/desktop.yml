name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release desktop
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - build-only
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
      - "vite.config.ts"
      - "react-router.config.ts"

permissions:
  contents: read

concurrency:
  group: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != 'build-only')) && 'desktop-release' || format('desktop-build-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set desktop release version
        if: github.event_name == 'workflow_dispatch' && inputs.release != 'build-only'
        shell: bash
        env:
          RELEASE_BUMP: ${{ inputs.release }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Select the main branch to release Bear Editor."
            exit 1
          fi
          npm run desktop:release -- "$RELEASE_BUMP" --no-git-tag-version
      - run: npm ci
      - run: npm run desktop:build
        # Same public website ID as the production web deployment in netlify.toml.
        env:
          VITE_UMAMI_WEBSITE_ID: 282c028b-3c2c-4e3f-a0a5-e3192e644dba
      - run: npm install --prefix desktop
      - run: npm --prefix desktop run package
      - uses: actions/upload-artifact@v4
        with:
          name: bear-editor-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.blockmap
            !desktop/dist/*.dmg.blockmap
            desktop/dist/latest.yml
            desktop/dist/latest-linux.yml

  release:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release != 'build-only' && github.ref == 'refs/heads/main')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: bear-editor-*
          path: release-assets
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          cd release-assets
          shopt -s nullglob
          dmg=(*.dmg)
          exe=(*.exe)
          appimage=(*.AppImage)
          if [[ ${#dmg[@]} -ne 1 || ${#exe[@]} -ne 1 || ${#appimage[@]} -ne 1 ]]; then
            echo "Expected one macOS DMG, Windows installer, and Linux AppImage."
            exit 1
          fi
          test -s latest.yml
          test -s latest-linux.yml
          test -s "${exe[0]}.blockmap"
      - name: Commit and tag desktop version
        if: github.event_name == 'workflow_dispatch'
        id: version
        shell: bash
        env:
          RELEASE_BUMP: ${{ inputs.release }}
        run: |
          npm run desktop:release -- "$RELEASE_BUMP" --no-git-tag-version
          tag="v$(node -p 'require("./desktop/package.json").version')"
          git add desktop/package.json desktop/package-lock.json
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git fetch origin "refs/tags/$tag"
            # A retry can reuse the tag if it points to the exact version bump.
            test "$(git rev-parse FETCH_HEAD^)" = "$GITHUB_SHA"
            test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git write-tree)"
          else
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Release desktop $tag"
            git push --atomic origin HEAD:refs/heads/main "HEAD:refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish desktop release
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag || github.ref_name }}
