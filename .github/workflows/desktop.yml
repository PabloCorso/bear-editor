name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
      - "vite.config.ts"
      - "react-router.config.ts"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
        # Same public website ID as the production web deployment in netlify.toml.
        env:
          VITE_UMAMI_WEBSITE_ID: 282c028b-3c2c-4e3f-a0a5-e3192e644dba
      - run: npm install --prefix desktop
      - run: npm --prefix desktop run package
      - uses: actions/upload-artifact@v4
        with:
          name: bear-editor-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.blockmap
            !desktop/dist/*.dmg.blockmap
            desktop/dist/latest.yml
            desktop/dist/latest-linux.yml

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bear-editor-*
          path: release-assets
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          cd release-assets
          shopt -s nullglob
          dmg=(*.dmg)
          exe=(*.exe)
          appimage=(*.AppImage)
          if [[ ${#dmg[@]} -ne 1 || ${#exe[@]} -ne 1 || ${#appimage[@]} -ne 1 ]]; then
            echo "Expected one macOS DMG, Windows installer, and Linux AppImage."
            exit 1
          fi
          test -s latest.yml
          test -s latest-linux.yml
          test -s "${exe[0]}.blockmap"
      - run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
