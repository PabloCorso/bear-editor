name: Validate editor
on:
  push:
    branches: [feat/unified-material-workflows]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx react-router typegen
      - run: npm run validate
      - run: npm run build
