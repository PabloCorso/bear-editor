name: One-time format unified UI branch
on:
  push:
    branches: [feat/unified-material-workflows]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: npx prettier --write app/editor/edit-mode/context-menu.tsx app/editor/edit-mode/editor-view.tsx app/editor/edit-mode/engine/editor-engine.ts app/editor/edit-mode/scene/editor-scene-builder.ts app/editor/edit-mode/toolbars/color-tool-control.tsx app/editor/edit-mode/toolbars/control-toolbar.tsx app/editor/edit-mode/toolbars/picture-conversion-dialog.tsx app/editor/edit-mode/toolbars/picture-texture-picker.tsx app/editor/edit-mode/toolbars/picture-tool-control.tsx app/editor/edit-mode/toolbars/replace-selection-dialog.tsx app/editor/edit-mode/toolbars/texture-tool-control.tsx app/editor/edit-mode/toolbars/tool-info.tsx app/editor/edit-mode/tools/default-tools.ts app/editor/edit-mode/tools/scenery-fill-tool.ts app/editor/edit-mode/tools/select-tool.ts app/editor/edit-mode/tools/selection-clipboard.ts app/editor/edit-mode/tools/texture-fill-tool.ts app/editor/edit-mode/tools/tool-interface.ts app/editor/helpers/picture-silhouette.ts app/editor/helpers/texture-fill.ts app/editor/history/editor-history-actions.ts CHANGELOG.md ROADMAP.md docs/material-workflows.md docs/replace-selection.md docs/texture-fill.md .github/workflows/validate.yml
      - name: Commit formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/editor/edit-mode/context-menu.tsx app/editor/edit-mode/editor-view.tsx app/editor/edit-mode/engine/editor-engine.ts app/editor/edit-mode/scene/editor-scene-builder.ts app/editor/edit-mode/toolbars/color-tool-control.tsx app/editor/edit-mode/toolbars/control-toolbar.tsx app/editor/edit-mode/toolbars/picture-conversion-dialog.tsx app/editor/edit-mode/toolbars/picture-texture-picker.tsx app/editor/edit-mode/toolbars/picture-tool-control.tsx app/editor/edit-mode/toolbars/replace-selection-dialog.tsx app/editor/edit-mode/toolbars/texture-tool-control.tsx app/editor/edit-mode/toolbars/tool-info.tsx app/editor/edit-mode/tools/default-tools.ts app/editor/edit-mode/tools/scenery-fill-tool.ts app/editor/edit-mode/tools/select-tool.ts app/editor/edit-mode/tools/selection-clipboard.ts app/editor/edit-mode/tools/texture-fill-tool.ts app/editor/edit-mode/tools/tool-interface.ts app/editor/helpers/picture-silhouette.ts app/editor/helpers/texture-fill.ts app/editor/history/editor-history-actions.ts CHANGELOG.md ROADMAP.md docs/material-workflows.md docs/replace-selection.md docs/texture-fill.md .github/workflows/validate.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format unified editor workflows"
          git push origin HEAD:feat/unified-material-workflows
